<style>
    .subscribe { 
        background-color: rgb(209, 1, 1);
        color: white;
        border: none;
        height: 30px;
        width: 100px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        transition: opacity 0.15s;
    }
    
    .subscribe:hover{
        opacity: 0.7;
    }
    
    .subscribe:active{
        opacity: 0.3;
    }

    .join {
        background-color: white;
        color: rgb(42, 138, 255);
        border-color: rgb(42, 138, 255);
        height: 30px;
        width: 60;
        border-style: solid;
        border-width: 1px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        transition: background-color 0.15s,
            color 0.15s
    }

    .join:hover{

        background-color: rgb(42, 138, 255);
        color: white;
    }

    .join:active{
        opacity: 0.7;
    }

    .tweet {
        background-color: rgb(48, 134, 255);
        color: white;
        height: 30px;
        width: 60;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        margin-right: 8px;
        transition: box-shadow 1s;
    }
    
    .tweet:hover {
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
    }
    
</style>

<button class="subscribe">
    SUBSCRIBE
</button>

<button class="join">
    JOIN
</button>

<button class="tweet">
    Tweet
</button>
